databases:
  - name: quant-db
    plan: free
    databaseName: quant

services:
  - type: web
    name: quant-backend
    env: python
    plan: free
    buildCommand: "cd quant_engine && pip install -r requirements.txt"
    startCommand: "cd quant_engine && bash render-start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quant-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
