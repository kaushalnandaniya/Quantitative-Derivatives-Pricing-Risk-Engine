name: Quant Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # Backend Tests
  # =========================================================================
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('quant_engine/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd quant_engine
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd quant_engine
          python -m pytest tests/ -v --tb=short

      - name: Check API starts
        run: |
          cd quant_engine
          timeout 10 python -m uvicorn api.main:app --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health

  # =========================================================================
  # Frontend Build
  # =========================================================================
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
